name: CI

# Runs the whole test suite for every pull request into main and for every
# push to main (that is, every merge). Everything executes in Docker through
# the same Makefile targets as on a developer machine, so "green locally" and
# "green in CI" mean the same thing.
#
# Branch protection requires ONE status check: the `CI` job at the bottom,
# which succeeds only when every other job did. Add a job here and list it in
# that job's `needs`; the protection rule does not change.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs the whole suite again on the tagged commit.
  workflow_call:

# A new push to a pull request supersedes the previous run; runs on main are
# never cancelled, so every merge gets a verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # gofmt + go vet + go test -race ./... against a throw-away PostgreSQL.
      - run: make test-backend

  web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # eslint + tsc + vitest.
      - run: make test-web

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Builds the *runtime* images (including `next build`, which the unit
      # tests do not run) and waits for their health checks.
      - name: Build and start the stack
        run: |
          CRYPTOPAY_VERSION="$(cat VERSION)" CRYPTOPAY_COMMIT="$(git rev-parse --short=12 HEAD)" \
            docker compose up -d --build --wait --wait-timeout 300
      - name: The gateway reports the release version
        run: docker compose exec -T backend /usr/local/bin/gateway version | tee /dev/stderr | grep -F "gateway $(cat VERSION) (commit "
      - name: Smoke test
        run: scripts/smoke.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compose files are valid
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.test.yml --profile live config --quiet
      - name: VERSION, web/package.json and CHANGELOG.md agree
        run: scripts/check-version.sh
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Workflows pass actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # The single required status check (see the header comment).
  ci:
    name: CI
    if: always()
    needs: [backend, web, stack, repo]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a job finished as '$result'" >&2; exit 1; }
          done
