name: Release

# Pushing a tag vX.Y.Z publishes that version (docs/releasing.md):
#   1. verify  - the tag is v$VERSION, CHANGELOG.md has the section, and the
#                tagged commit is on main
#   2. ci      - the whole test suite runs again on the tagged commit
#   3. images  - the gateway and web images go to GitHub Container Registry
#   4. release - a GitHub release whose notes are the CHANGELOG section
# The release is created last, so a failed run never leaves a release without
# images; re-run the failed jobs after fixing the cause.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag matches VERSION and CHANGELOG.md
        run: scripts/check-version.sh --tag "$GITHUB_REF_NAME"
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main: merge the release pull request first" >&2
            exit 1
          }
      - id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  images:
    name: Publish the ${{ matrix.service }} image
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the gateway stamps its version into the binary.
          - service: backend
            build_args: |
              VERSION=${{ needs.verify.outputs.version }}
              COMMIT=${{ github.sha }}
          - service: web
            build_args: ""
    steps:
      - uses: actions/checkout@v7
      # Image names must be lower case; the owner name may not be.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # 0.1.0 always; 0.1 and latest only for a final release, not for 0.2.0-rc.1.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
          flavor: |
            latest=${{ needs.verify.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=CryptoPay ${{ matrix.service }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}

  release:
    name: GitHub release
    needs: [verify, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          {
            scripts/release-notes.sh "$VERSION"
            printf '\n### Docker images\n\n`%s-backend:%s`  \n`%s-web:%s`\n' "$image" "$VERSION" "$image" "$VERSION"
            printf '\nProvided as is, without warranty: test your whole setup before you accept real funds (see the [disclaimer](https://github.com/%s#disclaimer)).\n' "$GITHUB_REPOSITORY"
          } > "$RUNNER_TEMP/notes.md"
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--title "CryptoPay $TAG" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag "${flags[@]}"
          fi
